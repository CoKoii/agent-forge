packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@nestjs/config": ^12.0.1
  "@types/node": ^24
  joi: ^18.3.0
  nest-winston: ^2.0.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vite-plus: 1.2.0
  winston: ^3.19.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
